name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Backend tests with coverage
        run: npm run test:server:coverage

      - name: Angular unit tests
        run: npm test -- --watch=false
        env:
          CI: 'true'

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: coverage/server
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Validate Docker image
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: mermelada-erp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and wait for health
        run: |
          docker run -d --name mermelada-ci \
            -e AUTH_ENABLED=false \
            -p 127.0.0.1:4000:4000 \
            mermelada-erp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs mermelada-ci
          exit 1

      - name: Smoke test container
        run: docker exec mermelada-ci node scripts/smoke-test.mjs

      - name: Container logs on failure
        if: failure()
        run: docker logs mermelada-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f mermelada-ci || true
