# Nginx reverse proxy with TLS termination.
#
# 1. Replace erp.example.com with your domain.
# 2. Install certificates (example uses Certbot):
#      sudo certbot --nginx -d erp.example.com
#    or obtain them first and keep the paths below.
# 3. sudo cp deploy/nginx/mermelada.conf /etc/nginx/sites-available/mermelada
#    sudo ln -s /etc/nginx/sites-available/mermelada /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name erp.example.com;

    # Certbot (nginx plugin) injects /.well-known/acme-challenge here.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.example.com;

    ssl_certificate     /etc/letsencrypt/live/erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 4m;

    # Health probe used by uptime monitors; keep logs quiet.
    location = /api/health {
        proxy_pass http://127.0.0.1:4000;
        access_log off;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
